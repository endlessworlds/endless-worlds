name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1

jobs:
  export:
    name: Export Web + Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot + export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      # The game only needs URLs; API keys belong to the AI server, never to public builds.
      - name: Create .env
        run: |
          {
            echo "RELAY_URL=${{ vars.RELAY_URL || 'wss://endless-worlds-relay.srujanmpadmashali.workers.dev' }}"
            if [ -n "${{ vars.API_URL }}" ]; then echo "API_URL=${{ vars.API_URL }}"; fi
          } > .env

      - name: Import + export
        run: |
          godot --headless --import || true
          mkdir -p build/web build/windows
          godot --headless --export-release "Web" build/web/index.html
          godot --headless --export-release "Windows Desktop" build/windows/EndlessWorlds.exe
          cp build/web/index.html build/web/404.html
          # "Add to Home Screen" manifest + icons (fullscreen app on phones)
          cp web/manifest.webmanifest web/icon_*.png build/web/

      - uses: actions/upload-artifact@v4
        with:
          name: EndlessWorlds-Windows
          path: build/windows

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      # Last step so its summary is at the end of the log. Doesn't block the deploy.
      - name: Check GDScript compiles
        continue-on-error: true
        run: |
          godot --headless --path . --script res://tools/check_scripts.gd 2>&1 | grep -E "SCRIPT CHECK|SCRIPT ERROR|Parse Error|Compile Error|ERROR:" | head -80
          exit ${PIPESTATUS[0]}

  pages:
    # Repo Settings → Pages → Source: "GitHub Actions"
    name: Deploy web build to GitHub Pages
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  deploy-relay:
    # Optional: add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets to enable (see relay/README.md).
    name: Deploy multiplayer relay
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 20
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: relay
        run: npm install --no-audit --no-fund && npx wrangler deploy
