html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">
<meta name=\"apple-mobile-web-app-title\" content=\"Endless Worlds\">
<meta name=\"theme-color\" content=\"#000000\">
<link rel=\"manifest\" href=\"manifest.webmanifest\">
<link rel=\"apple-touch-icon\" href=\"icon_180.png\">
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; }
body { position: fixed; inset: 0; }
body, #canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
input, textarea { font-size: 16px !important; -webkit-user-select: text; user-select: text; }
</style>
<script>
/* Phones: go fullscreen automatically on the first tap (browsers only allow it inside a
   tap), and again after the browser drops out of it (e.g. app switch). The in-game
   \"Exit fullscreen\" button turns this off (window.ewAutoFullscreen = false). */
(function () {
  var d = document, el = d.documentElement;
  window.ewIsPhone = (navigator.maxTouchPoints || 0) > 0 && window.matchMedia && matchMedia('(pointer: coarse)').matches;
  window.ewAutoFullscreen = window.ewIsPhone;
  function isFs() { return !!(d.fullscreenElement || d.webkitFullscreenElement); }
  window.ewFullscreen = function () {
    if (isFs()) return;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    try { var p = req.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  };
  window.ewExitFullscreen = function () {
    var ex = d.exitFullscreen || d.webkitExitFullscreen;
    if (ex && isFs()) { try { var p = ex.call(d); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  };
  function onTap() { if (window.ewAutoFullscreen) window.ewFullscreen(); }
  d.addEventListener('pointerup', onTap, true);
  d.addEventListener('touchend', onTap, true);

  /* The phone's keyboard must never open (the game has its own): any page text field
     that gets focus is made keyboard-less and un-focused at once. */
  d.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) {
      t.setAttribute('inputmode', 'none');
      t.readOnly = true;
      try { t.blur(); } catch (err) {}
    }
  }, true);

  /* Install as an app (\"Install app\" button on the home screen). Chrome/Edge hand us
     an install prompt; Safari/iPhone needs Share > Add to Home Screen instead. */
  window.ewInstalled = !!(navigator.standalone || (window.matchMedia &&
    (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches)));
  window.ewInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.ewInstallPrompt = e; });
  window.addEventListener('appinstalled', function () { window.ewInstalled = true; window.ewInstallPrompt = null; });
  window.ewInstall = function () {
    var p = window.ewInstallPrompt;
    if (!p) return 'manual';
    window.ewInstallPrompt = null;
    try { p.prompt(); } catch (e) { return 'manual'; }
    return 'prompted';
  };
})();
</script>"
